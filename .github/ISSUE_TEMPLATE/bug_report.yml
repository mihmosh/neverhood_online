name: Bug report
description: Report a problem importing or playing your own copy of the game.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Do not upload game archives, installers, saved games, credentials, or other private files.
        A browser version, the error text, and clear steps are usually enough.
        Report security vulnerabilities privately through the Security tab instead.
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome version, Windows / Linux / macOS
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: What were you importing?
      options:
        - Installed game folder
        - Installer folder
        - ZIP archive
        - Nothing; the game was already imported
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
      description: Include what happened and what you expected. Do not include download links to unauthorized game copies.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message or sanitized console output
      description: Remove personal paths, secrets, and private data before posting.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not attached game files, installers, saved games, credentials, or private data.
          required: true
