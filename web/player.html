<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neverhood Player</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    body { display:grid; place-items:center; }
    canvas { display:block; width:min(100vw, calc(100dvh * 4 / 3)); height:min(100dvh, calc(100vw * 3 / 4)); object-fit:contain; background:#000; image-rendering:auto; outline:none; }
    [hidden] { display:none!important; }
  </style>
  <script type="module" src="./player.js"></script>
</head>
<body><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Neverhood game"></canvas></body>
</html>
