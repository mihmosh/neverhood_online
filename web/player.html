<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neverhood Player</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    body { display:grid; place-items:center; }
    canvas { display:block; width:min(100vw, calc(100dvh * 4 / 3)); height:min(100dvh, calc(100vw * 3 / 4)); object-fit:contain; background:#000; image-rendering:auto; outline:none; }
    [hidden] { display:none !important; }
    #game-menu { position:fixed; z-index:2; top:max(8px, env(safe-area-inset-top)); left:max(8px, env(safe-area-inset-left)); min-width:68px; min-height:44px; padding:8px 14px; border:1px solid #f1dec266; border-radius:10px; background:#181818d9; color:#f1dec2; font:600 14px/1.2 sans-serif; cursor:pointer; touch-action:manipulation; }
    #game-menu:hover { background:#35312a; }
    #game-menu:focus-visible { outline:3px solid #f1dec2; outline-offset:2px; }
    [hidden] { display:none!important; }
  </style>
  <script type="module" src="./player.js"></script>
</head>
<body><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="Neverhood game"></canvas><button id="game-menu" type="button" aria-label="Game menu (Esc)" hidden>Menu</button></body>
</html>
